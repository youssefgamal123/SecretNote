
name: SecretNote CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Test and Build Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Get the repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Java 17 and Maven dependency caching
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Make Maven wrapper executable on Linux
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # 4. Run unit tests
      - name: Run unit tests
        run: ./mvnw -B test

      # 5. Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Generate Docker image name and tags
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      # 7. Authenticate with GitHub Container Registry
      # Only authenticate when pushing to main
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 8. Build Docker image
      # Publish only when code is pushed to main
      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
